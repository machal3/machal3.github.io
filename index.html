<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Odliczanie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f6f2;
      --text-main: #141414;
      --text-muted: #787570;
      --border-line: #dfdcd5;
      --border-light: #ece9e2;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text-main);
      padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 6vw, 3rem);
      padding-top: max(clamp(1.5rem, 5vw, 4rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(1.5rem, 5vw, 4rem), env(safe-area-inset-bottom));
      padding-left: max(clamp(1.25rem, 6vw, 3rem), env(safe-area-inset-left));
      padding-right: max(clamp(1.25rem, 6vw, 3rem), env(safe-area-inset-right));
      font-family: "Newsreader", Garamond, Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
    }

    header {
      margin-bottom: clamp(2rem, 4vw, 3rem);
    }

    .meta {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(0.68rem, 1.8vw, 0.75rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: clamp(0.75rem, 2vw, 1.25rem);
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.25rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--border-line);
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: clamp(1rem, 3.5vw, 2.5rem);
      row-gap: clamp(1.75rem, 4vw, 2.5rem);
      margin-bottom: clamp(3rem, 7vw, 4.5rem);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .num {
      font-family: "Newsreader", serif;
      font-size: clamp(2.8rem, 8.5vw, 4.5rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .label {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(0.62rem, 1.6vw, 0.7rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: clamp(0.6rem, 1.5vw, 1rem);
    }

    /* Oś czasu i wskaźnik drogi */
    .timeline-container {
      position: relative;
      width: 100%;
      padding-top: 2rem;
    }

    .timeline-track {
      position: relative;
      width: 100%;
      height: 1px;
      background: var(--border-line);
    }

    .timeline-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 1px;
      background: var(--text-main);
      width: 0%;
      transition: width 0.3s ease-out;
    }

    /* Ruchomy marker ze wskaźnikiem */
    .timeline-marker {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.3s ease-out;
      pointer-events: none;
    }

    .marker-dot {
      width: 7px;
      height: 7px;
      background: var(--bg);
      border: 1.5px solid var(--text-main);
      border-radius: 50%;
    }

    .marker-value {
      position: absolute;
      bottom: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--text-main);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Podziałka i daty graniczne */
    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 6px;
      user-select: none;
    }

    .tick {
      width: 1px;
      height: 4px;
      background: var(--border-line);
    }

    .tick.major {
      height: 7px;
      background: var(--text-muted);
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .finished {
      display: none;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-style: italic;
      color: var(--text-main);
      margin-bottom: 2.5rem;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .unit {
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        padding-bottom: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="meta">14 września 2026 — 18:00 CEST</div>
      <h1>Odliczanie</h1>
    </header>

    <div class="rule"></div>

    <div class="grid" id="timer">
      <div class="unit">
        <span class="num" id="days">00</span>
        <span class="label">Dni</span>
      </div>
      <div class="unit">
        <span class="num" id="hours">00</span>
        <span class="label">Godzin</span>
      </div>
      <div class="unit">
        <span class="num" id="minutes">00</span>
        <span class="label">Minut</span>
      </div>
      <div class="unit">
        <span class="num" id="seconds">00</span>
        <span class="label">Sekund</span>
      </div>
    </div>

    <div class="finished" id="finished-message">Czas dobiegł końca.</div>

    <div class="timeline-container">
      <div class="timeline-track">
        <div class="timeline-fill" id="timeline-fill"></div>
        <div class="timeline-marker" id="timeline-marker">
          <span class="marker-value" id="percent-label">0.0%</span>
          <div class="marker-dot"></div>
        </div>
      </div>

      <div class="timeline-ticks">
        <div class="tick major"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick major"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick major"></div>
      </div>

      <div class="timeline-labels">
        <span>21.08</span>
        <span>14.09</span>
      </div>
    </div>
  </main>

  <script>
    const startDate = new Date("2026-08-21T00:00:00+02:00").getTime();
    const targetDate = new Date("2026-09-14T18:00:00+02:00").getTime();
    const totalDuration = targetDate - startDate;

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const timerGrid = document.getElementById("timer");
    const finishedMsg = document.getElementById("finished-message");
    const timelineFill = document.getElementById("timeline-fill");
    const timelineMarker = document.getElementById("timeline-marker");
    const percentLabel = document.getElementById("percent-label");

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      const elapsed = Math.max(0, Math.min(now - startDate, totalDuration));
      const ratio = elapsed / totalDuration;
      const percentage = ratio * 100;
      
      timelineFill.style.width = percentage.toFixed(2) + "%";
      timelineMarker.style.left = percentage.toFixed(2) + "%";
      percentLabel.textContent = percentage.toFixed(1) + "%";

      if (difference <= 0) {
        clearInterval(interval);
        timerGrid.style.display = "none";
        finishedMsg.style.display = "block";
        timelineFill.style.width = "100%";
        timelineMarker.style.left = "100%";
        percentLabel.textContent = "100%";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    const interval = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
