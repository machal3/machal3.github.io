<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Odliczanie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2;
      --text-main: #141414;
      --text-muted: #787570;
      --border-line: #dfdcd5;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-main);
      padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 6vw, 3rem);
      padding-top: max(clamp(1.5rem, 5vw, 4rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(1.5rem, 5vw, 4rem), env(safe-area-inset-bottom));
      padding-left: max(clamp(1.25rem, 6vw, 3rem), env(safe-area-inset-left));
      padding-right: max(clamp(1.25rem, 6vw, 3rem), env(safe-area-inset-right));
      font-family: "Newsreader", Garamond, Georgia, serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    main {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
    }

    header { margin-bottom: clamp(2rem, 4vw, 3rem); }

    .meta,
    .label,
    .timeline-labels,
    .play-button,
    .marker-value,
    .game-status {
      font-family: "Space Grotesk", sans-serif;
    }

    .meta {
      font-size: clamp(.68rem, 1.8vw, .75rem);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: clamp(.75rem, 2vw, 1.25rem);
    }

    h1 {
      width: fit-content;
      font-size: clamp(2.4rem, 7vw, 3.25rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -.025em;
    }

    .rule {
      height: 1px;
      background: var(--border-line);
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: clamp(1rem, 3.5vw, 2.5rem);
      row-gap: clamp(1.75rem, 4vw, 2.5rem);
      margin-bottom: clamp(3rem, 7vw, 4.5rem);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .num {
      font-size: clamp(2.8rem, 8.5vw, 4.5rem);
      font-weight: 300;
      line-height: .9;
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: clamp(.6rem, 1.5vw, 1rem);
      font-size: clamp(.62rem, 1.6vw, .7rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .finished {
      display: none;
      margin-bottom: 2.5rem;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-style: italic;
    }

    .timeline-container {
      position: relative;
      z-index: 4;
      width: 100%;
      padding-top: 2rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .timeline-track {
      position: relative;
      height: 1px;
      background: var(--border-line);
    }

    .timeline-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--text-main);
      transition: width .15s ease-out;
    }

    .timeline-marker {
      position: absolute;
      top: 50%;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      transition: left .15s ease-out;
      pointer-events: none;
    }

    .marker-dot {
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--text-main);
      border-radius: 50%;
      background: var(--bg);
    }

    .marker-value {
      position: absolute;
      bottom: 12px;
      font-size: .68rem;
      letter-spacing: .08em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }

    .tick {
      width: 1px;
      height: 4px;
      background: var(--border-line);
    }

    .tick.major {
      height: 7px;
      background: var(--text-muted);
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      margin-top: .75rem;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .game-controls {
      display: flex;
      justify-content: flex-end;
      margin-top: clamp(1.4rem, 3.5vw, 2rem);
    }

    .play-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: .72rem 1.05rem;
      border: 1px solid var(--border-line);
      border-radius: 999px;
      background: transparent;
      color: var(--text-main);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .18s ease;
    }

    .play-button:hover,
    .play-button:focus-visible,
    body.game-active .play-button {
      border-color: var(--text-main);
      background: var(--text-main);
      color: var(--bg);
    }

    .play-button:focus-visible {
      outline: 2px solid var(--text-main);
      outline-offset: 3px;
    }

    .play-button:active { transform: scale(.97); }

    .play-icon {
      position: relative;
      width: 1.25rem;
      height: 1.25rem;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .play-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 53%;
      width: 0;
      height: 0;
      transform: translate(-50%, -50%);
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 5px solid currentColor;
    }

    body.game-active .play-icon::before,
    body.game-active .play-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 1px;
      height: 7px;
      border: 0;
      background: currentColor;
      transform: translateY(-50%);
    }

    body.game-active .play-icon::before { left: 7px; }
    body.game-active .play-icon::after { left: 11px; }

    body.game-over .play-icon::before { display: none; }

    body.game-over .play-icon::after {
      top: 50%;
      left: 53%;
      width: 0;
      height: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 5px solid currentColor;
    }

    .game-ball {
      position: fixed;
      z-index: 3;
      display: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-main);
      box-shadow: 0 0 0 3px rgba(20,20,20,.06);
      pointer-events: none;
    }

    .game-status {
      position: fixed;
      z-index: 5;
      display: none;
      width: min(86vw, 440px);
      padding: 1rem 1.25rem;
      border: 1px solid var(--border-line);
      background: rgba(247,246,242,.94);
      text-align: center;
      font-size: .72rem;
      line-height: 1.6;
      letter-spacing: .08em;
      text-transform: uppercase;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    body.game-active { touch-action: none; }
    body.game-active .game-ball { display: block; }
    body.game-active .timeline-marker { display: none; }
    body.game-active .timeline-container { cursor: none; }

    body.game-active .timeline-fill {
      top: -2px;
      width: 104px;
      height: 5px;
      border-radius: 999px;
      transition: none;
    }

    body.game-active .timeline-labels span:first-child::after {
      content: " · ESC — WYJŚCIE";
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); }

      .unit {
        padding-bottom: .75rem;
        border-bottom: 1px solid rgba(0,0,0,.04);
      }

      body.game-active .timeline-fill { width: 82px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="meta">14 września 2026 — 18:00 CEST</div>
      <h1>Odliczanie</h1>
    </header>

    <div class="rule" id="game-ceiling"></div>

    <div class="grid" id="timer">
      <div class="unit"><span class="num" id="days">00</span><span class="label">Dni</span></div>
      <div class="unit"><span class="num" id="hours">00</span><span class="label">Godzin</span></div>
      <div class="unit"><span class="num" id="minutes">00</span><span class="label">Minut</span></div>
      <div class="unit"><span class="num" id="seconds">00</span><span class="label">Sekund</span></div>
    </div>

    <div class="finished" id="finished-message">Czas dobiegł końca.</div>

    <div class="timeline-container" id="timeline">
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-fill" id="timeline-fill"></div>
        <div class="timeline-marker" id="timeline-marker">
          <span class="marker-value" id="percent-label">0.0%</span>
          <div class="marker-dot"></div>
        </div>
      </div>

      <div class="timeline-ticks">
        <div class="tick major"></div><div class="tick"></div><div class="tick"></div>
        <div class="tick"></div><div class="tick major"></div><div class="tick"></div>
        <div class="tick"></div><div class="tick"></div><div class="tick major"></div>
      </div>

      <div class="timeline-labels">
        <span>21.08</span>
        <span id="game-score">14.09</span>
      </div>
    </div>

    <div class="game-controls">
      <button class="play-button" id="play-button" type="button">
        <span class="play-icon" aria-hidden="true"></span>
        <span id="play-button-label">Zagraj</span>
      </button>
    </div>
  </main>

  <div class="game-ball" id="game-ball"></div>
  <button class="game-status" id="game-status" type="button"></button>

  <script>
    const startDate = new Date("2026-08-21T00:00:00+02:00").getTime();
    const targetDate = new Date("2026-09-14T18:00:00+02:00").getTime();
    const totalDuration = targetDate - startDate;

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const timerGrid = document.getElementById("timer");
    const finishedMsg = document.getElementById("finished-message");
    const timelineFill = document.getElementById("timeline-fill");
    const timelineMarker = document.getElementById("timeline-marker");
    const percentLabel = document.getElementById("percent-label");
    const timeline = document.getElementById("timeline");
    const timelineTrack = document.getElementById("timeline-track");
    const gameBall = document.getElementById("game-ball");
    const gameStatus = document.getElementById("game-status");
    const gameScore = document.getElementById("game-score");
    const playButton = document.getElementById("play-button");
    const playButtonLabel = document.getElementById("play-button-label");

    const game = {
      active: false,
      over: false,
      x: 0,
      y: 0,
      vx: 230,
      vy: 265,
      radius: 6,
      paddleX: 0,
      paddleWidth: 104,
      score: 0,
      lastTime: 0,
      frame: 0
    };

    let isWarping = false;
    let simulatedOffset = 0;
    let warpHoldTimer = 0;
    let warpPointerId = null;
    let warpStartX = 0;
    let warpStartY = 0;

    const pad = value => String(value).padStart(2, "0");

    function startWarp() {
      if (!game.active) {
        isWarping = true;
        if (navigator.vibrate) navigator.vibrate(25);
      }
    }

    function stopWarp() {
      clearTimeout(warpHoldTimer);
      warpHoldTimer = 0;
      warpPointerId = null;
      if (isWarping) {
        isWarping = false;
        simulatedOffset = 0;
      }
    }

    timeline.addEventListener("pointerdown", event => {
      if (game.active || event.button > 0) return;

      warpPointerId = event.pointerId;
      warpStartX = event.clientX;
      warpStartY = event.clientY;
      warpHoldTimer = setTimeout(startWarp, 420);
    });

    timeline.addEventListener("pointermove", event => {
      if (event.pointerId !== warpPointerId || isWarping) return;

      if (Math.hypot(event.clientX - warpStartX, event.clientY - warpStartY) > 10) {
        clearTimeout(warpHoldTimer);
        warpPointerId = null;
      }
    });

    window.addEventListener("pointerup", stopWarp);
    window.addEventListener("pointercancel", stopWarp);

    function updateCountdown() {
      if (isWarping) {
        simulatedOffset += 3 * 60 * 60 * 1000;
        if (navigator.vibrate && Math.random() > .75) navigator.vibrate(10);
      }

      const now = Date.now() + simulatedOffset;
      const difference = targetDate - now;
      const elapsed = Math.max(0, Math.min(now - startDate, totalDuration));
      const percentage = Math.min(100, elapsed / totalDuration * 100);

      if (!game.active) {
        timelineFill.style.width = percentage.toFixed(2) + "%";
        timelineFill.style.left = "0";
        timelineMarker.style.left = percentage.toFixed(2) + "%";
        percentLabel.textContent = isWarping
          ? "WARP " + percentage.toFixed(1) + "%"
          : percentage.toFixed(1) + "%";
      }

      if (difference <= 0) {
        timerGrid.style.display = "none";
        finishedMsg.style.display = "block";
        return;
      }

      timerGrid.style.display = "grid";
      finishedMsg.style.display = "none";

      daysEl.textContent = pad(Math.floor(difference / 86400000));
      hoursEl.textContent = pad(Math.floor(difference % 86400000 / 3600000));
      minutesEl.textContent = pad(Math.floor(difference % 3600000 / 60000));
      secondsEl.textContent = pad(Math.floor(difference % 60000 / 1000));
    }

    function gameBounds() {
      const main = document.querySelector("main").getBoundingClientRect();
      const ceiling = document.getElementById("game-ceiling").getBoundingClientRect();
      const track = timelineTrack.getBoundingClientRect();

      return {
        left: main.left,
        right: main.right,
        top: ceiling.bottom + 10,
        bottom: track.top,
        trackLeft: track.left,
        trackWidth: track.width
      };
    }

    function setPaddle(clientX) {
      const bounds = gameBounds();
      game.paddleWidth = timelineFill.getBoundingClientRect().width;
      game.paddleX = Math.max(0, Math.min(
        clientX - bounds.trackLeft - game.paddleWidth / 2,
        bounds.trackWidth - game.paddleWidth
      ));
      timelineFill.style.left = game.paddleX + "px";
    }

    function resetBall() {
      const bounds = gameBounds();

      game.paddleWidth = timelineFill.getBoundingClientRect().width;
      game.paddleX = (bounds.trackWidth - game.paddleWidth) / 2;
      game.x = bounds.left + bounds.trackWidth / 2;
      game.y = bounds.top + Math.max(28, (bounds.bottom - bounds.top) * .18);
      game.vx = (Math.random() < .5 ? -1 : 1) * 210;
      game.vy = 245;

      timelineFill.style.left = game.paddleX + "px";
    }

    function startGame() {
      stopWarp();
      cancelAnimationFrame(game.frame);

      game.active = true;
      game.over = false;
      game.score = 0;
      game.lastTime = 0;

      document.body.classList.add("game-active");
      document.body.classList.remove("game-over");

      gameBall.style.display = "";
      gameStatus.style.display = "none";
      gameScore.textContent = "WYNIK 00";
      playButtonLabel.textContent = "Zakończ grę";
      timelineFill.style.width = "";

      resetBall();

      if (navigator.vibrate) navigator.vibrate([25, 35, 25]);
      game.frame = requestAnimationFrame(gameLoop);
    }

    function loseGame() {
      game.over = true;
      document.body.classList.add("game-over");
      gameBall.style.display = "none";

      const bounds = gameBounds();
      gameStatus.innerHTML = "Koniec gry · wynik " + game.score + "<br>Dotknij, aby spróbować ponownie";
      gameStatus.style.left = (bounds.left + bounds.right) / 2 + "px";
      gameStatus.style.top = (bounds.top + bounds.bottom) / 2 + "px";
      gameStatus.style.display = "block";

      playButtonLabel.textContent = "Zagraj ponownie";

      if (navigator.vibrate) navigator.vibrate([70, 50, 110]);
    }

    function stopGame() {
      cancelAnimationFrame(game.frame);

      game.active = false;
      game.over = false;

      document.body.classList.remove("game-active", "game-over");
      gameBall.style.display = "";
      gameStatus.style.display = "none";
      gameScore.textContent = "14.09";
      playButtonLabel.textContent = "Zagraj";

      timelineFill.style.left = "0";
      timelineFill.style.width = "0%";
      updateCountdown();
    }

    function gameLoop(time) {
      if (!game.active || game.over) return;

      if (!game.lastTime) game.lastTime = time;
      const dt = Math.min((time - game.lastTime) / 1000, .025);
      game.lastTime = time;

      const bounds = gameBounds();

      game.x += game.vx * dt;
      game.y += game.vy * dt;

      if (game.x - game.radius <= bounds.left) {
        game.x = bounds.left + game.radius;
        game.vx = Math.abs(game.vx);
      }

      if (game.x + game.radius >= bounds.right) {
        game.x = bounds.right - game.radius;
        game.vx = -Math.abs(game.vx);
      }

      if (game.y - game.radius <= bounds.top) {
        game.y = bounds.top + game.radius;
        game.vy = Math.abs(game.vy);
      }

      const paddleLeft = bounds.trackLeft + game.paddleX;
      const paddleRight = paddleLeft + game.paddleWidth;
      const ballBottom = game.y + game.radius;

      if (
        game.vy > 0 &&
        ballBottom >= bounds.bottom - 3 &&
        ballBottom <= bounds.bottom + 10 &&
        game.x >= paddleLeft &&
        game.x <= paddleRight
      ) {
        game.y = bounds.bottom - game.radius - 4;

        const hit = (game.x - (paddleLeft + game.paddleWidth / 2)) / (game.paddleWidth / 2);
        const speed = Math.min(500, 265 + game.score * 14);

        game.vx = hit * speed * .92;
        game.vy = -Math.sqrt(Math.max(12000, speed * speed - game.vx * game.vx));

        game.score++;
        gameScore.textContent = "WYNIK " + pad(game.score);

        if (navigator.vibrate) navigator.vibrate(8);
      }

      if (game.y - game.radius > bounds.bottom + 18) {
        loseGame();
        return;
      }

      gameBall.style.transform =
        "translate3d(" + (game.x - game.radius) + "px," +
        (game.y - game.radius) + "px,0)";

      game.frame = requestAnimationFrame(gameLoop);
    }

    window.addEventListener("pointermove", event => {
      if (!game.active || game.over) return;
      event.preventDefault();
      setPaddle(event.clientX);
    }, { passive: false });

    window.addEventListener("keydown", event => {
      if (!game.active) return;

      if (event.key === "Escape") {
        stopGame();
        return;
      }

      if (game.over && ["Enter", " "].includes(event.key)) {
        startGame();
        return;
      }

      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();

        const direction = event.key === "ArrowLeft" ? -1 : 1;
        const bounds = gameBounds();

        game.paddleX = Math.max(0, Math.min(
          game.paddleX + direction * 28,
          bounds.trackWidth - game.paddleWidth
        ));

        timelineFill.style.left = game.paddleX + "px";
      }
    });

    playButton.addEventListener("click", () => {
      if (!game.active || game.over) startGame();
      else stopGame();
    });

    gameStatus.addEventListener("click", startGame);

    window.addEventListener("resize", () => {
      if (game.active) resetBall();
    });

    updateCountdown();
    setInterval(updateCountdown, 50);
  </script>
</body>
</html>
