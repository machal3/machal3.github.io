<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>14.09.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f7f6f2;
      color: #1a1a1a;
      padding: 2rem;
      font-family: "Newsreader", Garamond, Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 4rem;
    }

    .meta {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #737373;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: #111111;
    }

    h1 span {
      font-style: italic;
      color: #555555;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: #e0ded9;
      margin-bottom: 3.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 2.5rem;
      row-gap: 2rem;
    }

    .unit {
      display: flex;
      flex-direction: column;
    }

    .num {
      font-family: "Newsreader", serif;
      font-size: 4rem;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888888;
      margin-top: 1rem;
    }

    .finished {
      display: none;
      font-size: 1.5rem;
      font-style: italic;
      color: #111111;
    }

    @media (max-width: 600px) {
      body {
        padding: 2rem 1.5rem;
        justify-content: flex-start;
        padding-top: 5rem;
      }

      header {
        margin-bottom: 2.5rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .rule {
        margin-bottom: 2.5rem;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        column-gap: 1.5rem;
      }

      .num {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="meta">14 września 2026 — 18:00 CEST</div>
      <h1>Odliczanie <span>do początku.</span></h1>
    </header>

    <div class="rule"></div>

    <div class="grid" id="timer">
      <div class="unit">
        <span class="num" id="days">00</span>
        <span class="label">Dni</span>
      </div>
      <div class="unit">
        <span class="num" id="hours">00</span>
        <span class="label">Godzin</span>
      </div>
      <div class="unit">
        <span class="num" id="minutes">00</span>
        <span class="label">Minut</span>
      </div>
      <div class="unit">
        <span class="num" id="seconds">00</span>
        <span class="label">Sekund</span>
      </div>
    </div>

    <div class="finished" id="finished-message">Czas dobiegł końca.</div>
  </main>

  <script>
    const targetDate = new Date("2026-09-14T18:00:00+02:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const timerGrid = document.getElementById("timer");
    const finishedMsg = document.getElementById("finished-message");

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        clearInterval(interval);
        timerGrid.style.display = "none";
        finishedMsg.style.display = "block";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    const interval = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
